<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Checa Aí</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/simulator.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <!-- Pacote de ícones: cópia idêntica de assets/icons/icons.svg (inline porque <use> com arquivo externo não funciona pelo file://). Mudou um, muda o outro. -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="icon-present" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="12" rx="2"></rect>
      <path d="M12 16v4M8 20h8"></path>
      <path d="M10.5 8.2v3.6l3-1.8z"></path>
    </symbol>
  </svg>

  <div class="app">
    <header class="app-header">
      <div class="app-header__inner">
        <a class="app-brand" href="#/inicio">Checa Aí</a>
      </div>
    </header>

    <main class="app-main" id="main">
      <section data-screen="home" hidden></section>
      <section data-screen="simulator" hidden></section>
      <section data-screen="nickname" hidden></section>
      <section data-screen="mission" hidden></section>
      <section data-screen="mission-result" hidden></section>
      <section data-screen="match-end" hidden></section>
    </main>

    <footer class="app-footer">
      <div class="app-footer__inner">
        <span>Simulação educativa · CiberMissões 2026</span>
        <span id="app-version"></span>
      </div>
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/missions-data.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/components/post-card.js"></script>
  <script src="js/simulator-rumors.js"></script>
  <script src="js/simulator-model.js"></script>
  <script src="js/screens/home.js"></script>
  <script src="js/screens/simulator.js"></script>
  <script src="js/screens/nickname.js"></script>
  <script src="js/screens/mission.js"></script>
  <script src="js/screens/mission-result.js"></script>
  <script src="js/screens/match-end.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
